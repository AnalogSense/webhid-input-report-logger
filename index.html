<button onclick="onButtonClick();">Connect</button> <span></span><br/>
<textarea style="width:calc(100vw - 32px);height:calc(100vh - 64px)" readonly></textarea>
<script>
	function onButtonClick() {
		if (!navigator.hid) {
			alert("Sorry, your browser does not support WebHID.");
			return;
		}
		if (window.devs) {
			document.querySelector("button").textContent = "Connect";
			for (const dev of window.devs) {
				dev.close();
			}
			window.devs = null;
			return;
		}
		navigator.hid.requestDevice({ filters: [] }).then(devs => {
			document.querySelector("button").textContent = "Disconnect";
			document.querySelector("span").textContent = "Input reports from " + (devs[0].productName ? devs[0].productName : "Unknown Device") + " (" + devs[0].vendorId.toString(16).toUpperCase().padStart(4, "0") + ":" + devs[0].productId.toString(16).toUpperCase().padStart(4, "0") + "):";
			document.querySelector("textarea").value = "";
			window.devs = devs;
			console.log(devs);
			for (const dev of devs) {
				dev.open().then(() => {
					dev.oninputreport = function(event) {
						document.querySelector("textarea").value += [...new Uint8Array(event.data.buffer)].map(x => x.toString(16).padStart(2, "0")).join("") + "\n";
					};
				});
			}
		});
	}
	document.querySelector("textarea").value = ""; // Firefox loves to keep input values when reloading
</script>
